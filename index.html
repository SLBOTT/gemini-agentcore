<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Voice Agent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .status {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            border-left: 4px solid #667eea;
        }
        
        .status.connected {
            background: #e8f5e9;
            border-left-color: #4caf50;
            color: #2e7d32;
        }
        
        .status.recording {
            background: #ffebee;
            border-left-color: #f44336;
            color: #c62828;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .btn-danger {
            background: #f44336;
            color: white;
        }
        
        .btn-danger:hover:not(:disabled) {
            background: #d32f2f;
            transform: translateY(-2px);
        }
        
        .btn-danger:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .text-input {
            margin-top: 20px;
        }
        
        .text-input input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .text-input input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .chat-log {
            background: #f9f9f9;
            border-radius: 8px;
            padding: 15px;
            height: 200px;
            overflow-y: auto;
            font-size: 13px;
            margin-top: 20px;
            border: 1px solid #eee;
        }
        
        .chat-message {
            margin-bottom: 8px;
            padding: 8px;
            border-radius: 4px;
        }
        
        .chat-message.user {
            background: #e3f2fd;
            color: #0d47a1;
            text-align: right;
        }
        
        .chat-message.agent {
            background: #f3e5f5;
            color: #4a148c;
        }
        
        .chat-message.system {
            background: #f5f5f5;
            color: #666;
            font-style: italic;
        }
        
        .recording-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #f44336;
            border-radius: 50%;
            animation: pulse 1s infinite;
            margin-left: 8px;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .info {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 12px;
            border-radius: 4px;
            font-size: 13px;
            color: #1565c0;
            margin-top: 20px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎙️ Gemini Voice Agent</h1>
        <p class="subtitle">Talk to AI powered by Google Gemini</p>
        
        <div id="status" class="status">
            Status: <span id="statusText">Connecting...</span>
        </div>
        
        <div class="controls">
            <button id="recordBtn" class="btn-primary" disabled>
                🎤 Start Live Mic
            </button>
            <button id="stopBtn" class="btn-danger" disabled>
                ⏹️ Stop Live Mic
            </button>
        </div>
        
        <div class="text-input">
            <input 
                type="text" 
                id="textInput" 
                placeholder="Or type a message instead..."
                disabled
            >
            <button id="sendBtn" class="btn-primary" disabled style="width: 100%;">
                📤 Send
            </button>
        </div>
        
        <div class="chat-log" id="chatLog"></div>
        
        <div class="info">
            💡 <strong>How to use:</strong><br>
            1. Click "Start Live Mic" once<br>
            2. Speak naturally; audio streams continuously<br>
            3. Pause briefly to auto-end your turn<br>
            4. Or type a message and click "Send"
        </div>
    </div>

    <script>
        // Modified client setup for local WebSocket connection
        class GeminiVoiceClient {
            constructor() {
                this.websocket = null;
                this.audioContext = null;
                this.isRecording = false;
                this.mediaStream = null;
                this.captureContext = null;
                this.sourceNode = null;
                this.processorNode = null;
                this.silentGainNode = null;
                this.analyser = null;
                this.vadData = null;
                this.vadTimer = null;
                this.isSpeaking = false;
                this.lastSpeechAt = 0;
                this.lastTurnEndedAt = 0;
                this.speechThreshold = 8;
                this.silenceMsToEndTurn = 900;
                this.minGapBetweenTurnsMs = 600;
                this.targetSampleRate = 24000;
            }
            
            async connect() {
                try {
                    // Connect to local WebSocket server
                    const wsUrl = `ws://127.0.0.1:8080/ws`;
                    
                    this.websocket = new WebSocket(wsUrl);
                    
                    this.websocket.onopen = () => {
                        console.log('Connected to Gemini Voice Agent');
                        updateStatus('connected', 'Connected');
                        recordBtn.disabled = false;
                        stopBtn.disabled = true;
                        textInput.disabled = false;
                        sendBtn.disabled = false;
                    };
                    
                    this.websocket.onmessage = (event) => {
                        this.handleMessage(JSON.parse(event.data));
                    };
                    
                    this.websocket.onclose = () => {
                        console.log('Disconnected from agent');
                        updateStatus('disconnected', 'Disconnected - Refresh to reconnect');
                        recordBtn.disabled = true;
                        stopBtn.disabled = true;
                        textInput.disabled = true;
                        sendBtn.disabled = true;
                        this.stopRecording();
                    };
                    
                    this.websocket.onerror = (error) => {
                        console.error('WebSocket error:', error);
                        updateStatus('error', 'Connection Error');
                    };
                    
                } catch (error) {
                    console.error('Connection failed:', error);
                    updateStatus('error', 'Failed to connect');
                }
            }
            
            async startRecording() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            sampleRate: 24000,
                            channelCount: 1,
                            echoCancellation: true,
                            noiseSuppression: true
                        }
                    });

                    this.mediaStream = stream;
                    this.isRecording = true;
                    this.captureContext = new (window.AudioContext || window.webkitAudioContext)({
                        sampleRate: this.targetSampleRate
                    });

                    this.sourceNode = this.captureContext.createMediaStreamSource(stream);

                    // ScriptProcessor is widely supported for quick PCM capture.
                    this.processorNode = this.captureContext.createScriptProcessor(4096, 1, 1);
                    this.processorNode.onaudioprocess = (event) => {
                        if (!this.isRecording) {
                            return;
                        }
                        const input = event.inputBuffer.getChannelData(0);
                        this.sendAudio(input, event.inputBuffer.sampleRate);
                    };

                    this.analyser = this.captureContext.createAnalyser();
                    this.analyser.fftSize = 1024;
                    this.vadData = new Uint8Array(this.analyser.frequencyBinCount);

                    this.silentGainNode = this.captureContext.createGain();
                    this.silentGainNode.gain.value = 0;

                    this.sourceNode.connect(this.analyser);
                    this.sourceNode.connect(this.processorNode);
                    this.processorNode.connect(this.silentGainNode);
                    this.silentGainNode.connect(this.captureContext.destination);

                    this.setupVAD();
                    updateStatus('recording', 'Live mic on <span class="recording-indicator"></span>');
                    recordBtn.disabled = true;
                    stopBtn.disabled = false;
                    addChatMessage('system', 'Live mic started. Speak naturally; pauses auto-end turns.');

                } catch (error) {
                    console.error('Failed to start recording:', error);
                    alert('Please allow microphone access to use live voice chat.');
                }
            }

            setupVAD() {
                this.vadTimer = window.setInterval(() => {
                    if (!this.isRecording || !this.analyser) {
                        return;
                    }

                    this.analyser.getByteTimeDomainData(this.vadData);
                    let sum = 0;
                    for (let i = 0; i < this.vadData.length; i++) {
                        sum += Math.abs(this.vadData[i] - 128);
                    }
                    const avg = sum / this.vadData.length;
                    const now = Date.now();

                    if (avg > this.speechThreshold) {
                        this.isSpeaking = true;
                        this.lastSpeechAt = now;
                    } else if (this.isSpeaking && (now - this.lastSpeechAt) > this.silenceMsToEndTurn) {
                        this.isSpeaking = false;
                        if ((now - this.lastTurnEndedAt) > this.minGapBetweenTurnsMs) {
                            this.endTurn();
                            this.lastTurnEndedAt = now;
                        }
                    }
                }, 120);
            }
            
            stopRecording() {
                if (this.isRecording) {
                    this.isRecording = false;
                    this.endTurn();
                    updateStatus('connected', 'Connected');
                    recordBtn.disabled = false;
                    stopBtn.disabled = true;
                    addChatMessage('system', 'Live mic stopped.');
                }

                if (this.vadTimer) {
                    clearInterval(this.vadTimer);
                    this.vadTimer = null;
                }
                if (this.processorNode) {
                    this.processorNode.disconnect();
                    this.processorNode.onaudioprocess = null;
                    this.processorNode = null;
                }
                if (this.sourceNode) {
                    this.sourceNode.disconnect();
                    this.sourceNode = null;
                }
                if (this.analyser) {
                    this.analyser.disconnect();
                    this.analyser = null;
                }
                if (this.silentGainNode) {
                    this.silentGainNode.disconnect();
                    this.silentGainNode = null;
                }
                if (this.captureContext) {
                    this.captureContext.close();
                    this.captureContext = null;
                }
                if (this.mediaStream) {
                    this.mediaStream.getTracks().forEach((track) => track.stop());
                    this.mediaStream = null;
                }
            }
            
            downsampleBuffer(float32Buffer, inputSampleRate, outputSampleRate) {
                if (inputSampleRate === outputSampleRate) {
                    return float32Buffer;
                }
                if (outputSampleRate > inputSampleRate) {
                    return float32Buffer;
                }

                const sampleRateRatio = inputSampleRate / outputSampleRate;
                const newLength = Math.round(float32Buffer.length / sampleRateRatio);
                const result = new Float32Array(newLength);
                let offsetResult = 0;
                let offsetBuffer = 0;

                while (offsetResult < result.length) {
                    const nextOffsetBuffer = Math.round((offsetResult + 1) * sampleRateRatio);
                    let accum = 0;
                    let count = 0;
                    for (let i = offsetBuffer; i < nextOffsetBuffer && i < float32Buffer.length; i++) {
                        accum += float32Buffer[i];
                        count += 1;
                    }
                    result[offsetResult] = count > 0 ? (accum / count) : 0;
                    offsetResult += 1;
                    offsetBuffer = nextOffsetBuffer;
                }

                return result;
            }

            floatTo16BitPCM(float32Buffer) {
                const pcmBuffer = new ArrayBuffer(float32Buffer.length * 2);
                const view = new DataView(pcmBuffer);
                for (let i = 0; i < float32Buffer.length; i++) {
                    const s = Math.max(-1, Math.min(1, float32Buffer[i]));
                    view.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
                }
                return new Uint8Array(pcmBuffer);
            }

            uint8ToBase64(uint8Array) {
                let binary = '';
                const chunkSize = 0x8000;
                for (let i = 0; i < uint8Array.length; i += chunkSize) {
                    const chunk = uint8Array.subarray(i, i + chunkSize);
                    binary += String.fromCharCode.apply(null, chunk);
                }
                return btoa(binary);
            }

            sendAudio(float32Chunk, inputSampleRate) {
                try {
                    if (!this.websocket || this.websocket.readyState !== WebSocket.OPEN) {
                        return;
                    }

                    const downsampled = this.downsampleBuffer(float32Chunk, inputSampleRate, this.targetSampleRate);
                    const pcm16 = this.floatTo16BitPCM(downsampled);
                    const base64Audio = this.uint8ToBase64(pcm16);
                    
                    this.websocket.send(JSON.stringify({
                        type: 'audio',
                        audio: base64Audio,
                        format: 'pcm16',
                        sample_rate: this.targetSampleRate
                    }));
                    
                } catch (error) {
                    console.error('Failed to send audio:', error);
                }
            }
            
            sendText(text) {
                if (text.trim()) {
                    addChatMessage('user', text);
                    this.websocket.send(JSON.stringify({
                        type: 'text',
                        text: text
                    }));
                    textInput.value = '';
                }
            }

            endTurn() {
                if (this.websocket && this.websocket.readyState === WebSocket.OPEN) {
                    this.websocket.send(JSON.stringify({
                        type: 'end_turn'
                    }));
                }
            }
            
            handleMessage(message) {
                switch (message.type) {
                    case 'audio_response':
                        this.playAudio(message.audio);
                        break;
                    case 'text_response':
                        console.log('Agent response:', message.text);
                        addChatMessage('agent', message.text);
                        break;
                    case 'session_started':
                        console.log('Session started:', message.session_id);
                        addChatMessage('system', 'Session started. Ready to chat!');
                        break;
                    case 'turn_complete':
                        console.log('Turn completed');
                        updateStatus(
                            this.isRecording ? 'recording' : 'connected',
                            this.isRecording ? 'Live mic on <span class="recording-indicator"></span>' : 'Connected'
                        );
                        break;
                    case 'error':
                        console.error('Agent error:', message.message);
                        addChatMessage('system', '❌ Error: ' + message.message);
                        break;
                }
            }
            
            async playAudio(base64Audio) {
                try {
                    const audioData = atob(base64Audio);
                    const audioBuffer = new ArrayBuffer(audioData.length);
                    const view = new Uint8Array(audioBuffer);
                    
                    for (let i = 0; i < audioData.length; i++) {
                        view[i] = audioData.charCodeAt(i);
                    }
                    
                    if (!this.audioContext) {
                        this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    }
                    
                    try {
                        const decodedAudio = await this.audioContext.decodeAudioData(audioBuffer);
                        const source = this.audioContext.createBufferSource();
                        source.buffer = decodedAudio;
                        source.connect(this.audioContext.destination);
                        source.start();
                    } catch (e) {
                        console.log('Could not decode audio - skipping playback');
                    }
                    
                } catch (error) {
                    console.error('Failed to play audio:', error);
                }
            }
            
            disconnect() {
                if (this.websocket) {
                    this.websocket.close();
                }
                this.stopRecording();
            }
        }
        
        // DOM elements
        const recordBtn = document.getElementById('recordBtn');
        const stopBtn = document.getElementById('stopBtn');
        const textInput = document.getElementById('textInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatLog = document.getElementById('chatLog');
        const statusText = document.getElementById('statusText');
        
        // Initialize client
        const client = new GeminiVoiceClient();
        client.connect();
        
        // Event listeners
        recordBtn.addEventListener('click', () => client.startRecording());
        stopBtn.addEventListener('click', () => client.stopRecording());
        sendBtn.addEventListener('click', () => client.sendText(textInput.value));
        textInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') client.sendText(textInput.value);
        });
        
        // Helper functions
        function updateStatus(className, text) {
            const status = document.getElementById('status');
            status.className = 'status ' + className;
            statusText.innerHTML = text;
        }
        
        function addChatMessage(type, text) {
            const message = document.createElement('div');
            message.className = 'chat-message ' + type;
            message.textContent = text;
            chatLog.appendChild(message);
            chatLog.scrollTop = chatLog.scrollHeight;
        }
    </script>
</body>
</html>
